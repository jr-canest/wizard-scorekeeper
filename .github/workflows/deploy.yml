# Push to main → lint, build, deploy Firebase Hosting (scorekeeper site).
# Lets phone/cloud Claude sessions ship changes without a Mac.
# Cloud Functions are NOT deployed here — deploy those manually.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/
      - run: npm run build
      - name: Deploy hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WIZARD }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase-tools deploy --only hosting:scorekeeper --project wizard-scores-2521c --non-interactive
          rm "$RUNNER_TEMP/sa.json"
